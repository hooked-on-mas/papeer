name: Web browser regression

on:
  # main is checked by Pages through workflow_call before deployment; avoid duplicate runs.
  push:
    branches-ignore: [main]
    paths: ['frontend/**', '.github/workflows/web-tests.yml', '.github/workflows/pages.yml', 'papeer/**', 'sidecar/schemas/ink.py', 'pyproject.toml', 'uv.lock']
  pull_request:
    paths: ['frontend/**', '.github/workflows/web-tests.yml', '.github/workflows/pages.yml', 'papeer/**', 'sidecar/schemas/ink.py', 'pyproject.toml', 'uv.lock']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  browser:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync --locked
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend typecheck
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build:web
      - name: Install the WebKit engine (Edge is included in the Windows runner)
        run: node frontend/node_modules/playwright-core/cli.js install webkit
      - name: Run all Web browser regressions
        run: |
          New-Item -ItemType Directory -Path output -Force | Out-Null
          pnpm --dir frontend test:web *> output/web-browser-tests.log
          $result = $LASTEXITCODE
          Get-Content output/web-browser-tests.log
          exit $result
      - name: Keep test logs and synthetic fixture screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-browser-results
          if-no-files-found: ignore
          retention-days: 7
          path: |
            output/web-browser-tests.log
            output/iphone-review/**/*.png
            output/reader-interactions/**/*.png
            output/pwa/*.png
