name: Dependency security audit

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: audit (${{ matrix.os }})
    strategy:
      fail-fast: false
      # pip-audit evaluates platform markers on its host, so audit all supported OS families.
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: Audit locked Python dependencies
        run: uv run --no-project --python 3.12 python tools/audit_dependencies.py python
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: runner.os == 'Linux'
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: runner.os == 'Linux'
        with:
          node-version: 22
          package-manager-cache: false
      - name: Audit locked JavaScript dependencies
        if: runner.os == 'Linux'
        run: uv run --no-project --python 3.12 python tools/audit_dependencies.py javascript
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        if: runner.os == 'Linux'
        with:
          toolchain: stable
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        if: runner.os == 'Linux'
        with:
          tool: cargo-audit@0.22.2
      - name: Audit locked Rust dependencies
        if: runner.os == 'Linux'
        run: uv run --no-project --python 3.12 python tools/audit_dependencies.py rust
