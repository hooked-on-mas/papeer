name: Dependency security audit

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: audit (${{ matrix.os }})
    strategy:
      fail-fast: false
      # pip-audit evaluates platform markers on its host, so audit all supported OS families.
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Audit locked Python dependencies
        run: uv run --no-project --python 3.12 python tools/audit_dependencies.py python
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: runner.os == 'Linux'
        with:
          version: 12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: runner.os == 'Linux'
        with:
          node-version: 22
          package-manager-cache: false
      - name: Audit locked JavaScript dependencies
        if: runner.os == 'Linux'
        run: uv run --no-project --python 3.12 python tools/audit_dependencies.py javascript
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        if: runner.os == 'Linux'
        with:
          toolchain: stable
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        if: runner.os == 'Linux'
        with:
          tool: cargo-audit@0.22.2
      - name: Audit locked Rust dependencies
        if: runner.os == 'Linux'
        run: uv run --no-project --python 3.12 python tools/audit_dependencies.py rust
