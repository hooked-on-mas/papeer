# A version tag or a manual run builds and checks every platform. By default no installer is uploaded.
# To distribute, manually run this workflow on a vX.Y.Z tag with publish_installers=true. This explicitly
# authorizes PUBLIC Actions artifacts, even while the GitHub Release remains a draft for editing notes.
#   Windows x64            NSIS setup .exe and MSI            (windows-latest)
#   macOS Apple Silicon    .dmg, Papeer_X.Y.Z_aarch64.dmg     (macos-latest)
#   macOS Intel            .dmg, Papeer_X.Y.Z_x64.dmg         (macos-15-intel)
#   Linux x64              .deb, Papeer_X.Y.Z_amd64.deb       (ubuntu-22.04: glibc 2.35, so Ubuntu 22.04 and later)
# Only the automatic GITHUB_TOKEN is used: nothing is signed
# with a certificate (the Windows installers are unsigned; the Mac app and every program and library in it
# carry an ad-hoc signature, tauri.macos.conf.json and tools/sign_sidecar.py, and are not notarized) and the
# app has no updater, so no signing secrets are needed.
#
# Branch runs are verification only. Existing releases are never replaced: publish a new version instead.
# macos-15-intel is the last Intel image GitHub offers: when it goes, drop the macos-x64 row
# or build it on Apple Silicon under Rosetta.
#
# The build jobs only read the repository; only the release job, which runs no project code and no setup
# actions, may write (create the release). Third-party actions are pinned to commit SHAs (the version is in
# the comment); .github/dependabot.yml updates them weekly.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_installers:
        description: "このタグの検査済みインストーラーを公開配布する（Actions成果物も公開されます）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    uses: ./.github/workflows/dependency-audit.yml

  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate explicit distribution request
        if: github.event_name == 'workflow_dispatch' && inputs.publish_installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "公開配布は vX.Y.Z タグを指定して実行してください。" >&2
            exit 1
          fi
          # Listing must succeed: a network/permission failure is not evidence that a release is absent.
          releases=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name')
          if grep -Fxq -- "$TAG" <<< "$releases"; then
            echo "このタグのReleaseは既にあります。上書きせず新しいバージョンを作成してください。" >&2
            exit 1
          fi

  build:
    needs: [distribution, audit]
    name: build (${{ matrix.name }})
    strategy:
      # The other platforms' installers are still worth a look when one fails.
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            installers: "nsis/*-setup.exe msi/*.msi"
          - name: macos-arm64
            os: macos-latest
            installers: "dmg/*.dmg"
          - name: macos-x64
            os: macos-15-intel
            installers: "dmg/*.dmg"
          - name: linux-x64
            os: ubuntu-22.04
            installers: "deb/*.deb"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      # Build from the lock files as committed; fail instead of re-resolving.
      UV_LOCKED: "1"
      # The Windows runner's console code page cannot print the Japanese messages of the tools.
      PYTHONUTF8: "1"
    defaults:
      run:
        # bash on every runner (Git Bash on Windows), so each step is written once. `just build` runs its
        # recipes in PowerShell on Windows and in sh elsewhere (justfile).
        shell: bash
    # No dependency caches: a cache saved on a tag ref is never reused, and a release is built from scratch.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      # On a tag, every version must be the tag's; the Windows build also writes the release notes.
      - name: Check the tag against every version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          uv run python tools/bump_version.py --check "$version"
          mkdir -p release
          if [ "$RUNNER_OS" = Windows ]; then
            uv run python tools/bump_version.py --notes "$version" --output release/release-notes.md
          fi

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No cache (see above); setup-node v5+ caches by itself when a package.json names npm.
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable

      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: just

      # What Tauri builds and bundles against on Linux (WebKitGTK 4.1, GTK 3, the tray's appindicator,
      # librsvg for the icons, patchelf and file for the bundler).
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf file

      - name: Install dependencies
        run: |
          set -euo pipefail
          uv sync --all-groups
          pnpm --dir frontend install --frozen-lockfile
          cargo fetch --locked --manifest-path frontend/src-tauri/Cargo.toml

      # code-version.txt and the bundle hash, the PyInstaller onedir sidecar (dist/sidecar), on macOS its ad-hoc
      # signature (tools/sign_sidecar.py), its smoke test (tools/smoke_sidecar.py: the sidecar started in a
      # throwaway folder; no real AI is called), the tested folder placed at frontend/src-tauri/sidecar for
      # bundle.resources (tools/place_sidecar.py, then sidecar-sources.txt), `just check-sidecar`,
      # `pnpm tauri build` (the bundles of tauri.conf.json and tauri.<platform>.conf.json).
      - name: Build
        env:
          PAPEER_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.GOOGLE_DESKTOP_CLIENT_ID }}
          PAPEER_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ runner.os == 'Windows' && secrets.GOOGLE_DESKTOP_CLIENT_SECRET || '' }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            uv run python -m papeer.core.cloud_drive_config --require-configured
          fi
          just build

      - name: Verify bundled notices and generate this platform's inventory
        run: |
          set -euo pipefail
          uv run python tools/distribution_notices.py --check dist/sidecar
          uv run python tools/distribution_notices.py --check frontend/src-tauri/sidecar
          uv run python tools/license_inventory.py
          uv run python tools/license_inventory.py --check
          uv run python tools/check_release_inventory.py --output release

      # The app is signed ad hoc as a whole (Tauri, signingIdentity "-"), and each program and library of the
      # sidecar in its Resources on its own (tools/sign_sidecar.py): without a valid signature, Apple Silicon
      # does not run arm64 code.
      - name: Check the ad-hoc signatures
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          app=frontend/src-tauri/target/release/bundle/macos/Papeer.app
          codesign --verify --deep --strict --verbose=2 "$app"
          signature=$(codesign --display --verbose=2 "$app" 2>&1)
          echo "$signature"
          grep -q "Signature=adhoc" <<< "$signature"
          uv run python tools/sign_sidecar.py --verify "$app/Contents/Resources/sidecar"
          uv run python tools/distribution_notices.py --check "$app/Contents/Resources/sidecar"
          dmg=$(ls frontend/src-tauri/target/release/bundle/dmg/*.dmg)
          mount="$RUNNER_TEMP/papeer-dmg"
          mkdir -p "$mount"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          uv run python tools/distribution_notices.py --check "$mount/Papeer.app/Contents/Resources/sidecar"

      - name: Verify notices inside Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'frontend/src-tauri/target/release/bundle'
          $msi = @(Get-ChildItem "$bundle/msi/*.msi")
          $setup = @(Get-ChildItem "$bundle/nsis/*-setup.exe")
          if ($msi.Count -ne 1 -or $setup.Count -ne 1) { throw 'Expected one MSI and one NSIS installer' }
          $msiTarget = Join-Path $env:RUNNER_TEMP 'papeer-msi'
          $nsisTarget = Join-Path $env:RUNNER_TEMP 'papeer-nsis'
          # Administrative extraction only: do not install or launch the desktop app.
          $arguments = '/a "{0}" /qn TARGETDIR="{1}"' -f $msi[0].FullName, $msiTarget
          $process = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "MSI extraction failed: $($process.ExitCode)" }
          & 7z x -y "-o$nsisTarget" $setup[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'NSIS extraction failed' }
          foreach ($extracted in @($msiTarget, $nsisTarget)) {
            $launchers = @(Get-ChildItem -LiteralPath $extracted -Recurse -File -Filter 'papeer-sidecar.exe')
            if ($launchers.Count -ne 1) { throw 'Expected exactly one bundled sidecar' }
            uv run python tools/distribution_notices.py --check $launchers[0].DirectoryName
            if ($LASTEXITCODE -ne 0) { throw 'Installer license verification failed' }
          }

      # The package's dependencies, and the sidecar's launcher and the command line client installed as programs (mode 755).
      - name: Check the .deb
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          deb=$(ls frontend/src-tauri/target/release/bundle/deb/*.deb)
          dpkg-deb --info "$deb"
          grep -q libayatana-appindicator3-1 <<< "$(dpkg-deb --field "$deb" Recommends)"
          launcher=$(dpkg-deb --contents "$deb" | grep -E '/sidecar/papeer-sidecar$')
          echo "$launcher"
          grep -q '^-rwxr-xr-x' <<< "$launcher"
          cli=$(dpkg-deb --contents "$deb" | grep -E '/sidecar/papeer-cli$')
          echo "$cli"
          grep -q '^-rwxr-xr-x' <<< "$cli"
          extracted="$RUNNER_TEMP/papeer-deb"
          dpkg-deb --extract "$deb" "$extracted"
          sidecars=$(find "$extracted" -type f -name papeer-sidecar)
          if [ "$(printf '%s\n' "$sidecars" | wc -l)" -ne 1 ] || [ -z "$sidecars" ]; then
            echo "パッケージ内のsidecarが一意ではありません。" >&2
            exit 1
          fi
          uv run python tools/distribution_notices.py --check "$(dirname "$sidecars")"

      - name: Collect installers
        if: github.event_name == 'workflow_dispatch' && inputs.publish_installers
        env:
          INSTALLERS: ${{ matrix.installers }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release
          bundle=frontend/src-tauri/target/release/bundle
          for pattern in $INSTALLERS; do
            # The pattern is a glob, meant to expand here.
            # shellcheck disable=SC2206
            files=("$bundle"/$pattern)
            if [ "${#files[@]}" -ne 1 ]; then echo "インストーラーが 1 つではありません: $pattern: ${files[*]}" >&2; exit 1; fi
            cp "${files[0]}" release/
          done
          if [ "$RUNNER_OS" = Windows ]; then
            # The exact tracked source used for this build, without build outputs or environment secrets.
            git archive --format=tar.gz --prefix="papeer-${GITHUB_REF_NAME#v}/" \
              --output="release/papeer-${GITHUB_REF_NAME#v}-source.tar.gz" HEAD
          fi
          ls -l release

      # Public distribution is explicitly authorized above. A draft Release does NOT hide Actions artifacts.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch' && inputs.publish_installers
        with:
          name: release-${{ matrix.name }}
          path: release/
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_installers && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Attach to a draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/*.exe release/*.msi release/*.dmg release/*.deb)
          # Windows setup and MSI, two Mac disk images, one Linux package.
          if [ "${#files[@]}" -ne 5 ]; then echo "インストーラーが揃っていません: ${files[*]}" >&2; exit 1; fi
          inventories=(release/dependency-license-inventory.*.json)
          if [ "${#inventories[@]}" -ne 4 ]; then echo "全OSのライセンス台帳が揃っていません。" >&2; exit 1; fi
          sources=(release/*-source.tar.gz)
          if [ "${#sources[@]}" -ne 1 ]; then echo "配布版に対応するソースアーカイブがありません。" >&2; exit 1; fi
          releases=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name')
          if grep -Fxq -- "$TAG" <<< "$releases"; then
            echo "このタグのReleaseは既にあります。公開済みの配布物もdraftも置換しません。" >&2
            exit 1
          fi
          gh release create "$TAG" "${files[@]}" "${inventories[@]}" "${sources[@]}" --draft --verify-tag \
            --title "Papeer ${TAG#v}" --notes-file release/release-notes.md
