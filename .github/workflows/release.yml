# Pushing a tag vX.Y.Z builds the Windows installers (NSIS setup .exe and MSI) with `just build`
# and attaches them to a draft GitHub Release whose notes are the [X.Y.Z] section of CHANGELOG.md.
# Publish the draft by hand after checking it. Only the automatic GITHUB_TOKEN is used: the
# installers are not code-signed and the app has no updater, so no signing secrets are needed.
#
# The build job only reads the repository; only the release job, which runs no project code and
# no setup actions, may write (create the release). Third-party actions are pinned to commit SHAs
# (the version is in the comment); .github/dependabot.yml updates them weekly.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      # Build from the lock files as committed; fail instead of re-resolving.
      UV_LOCKED: "1"
      # The runner's console code page cannot print the Japanese messages of the tools.
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: pwsh
    # pwsh does not stop at a failing native command, so multi-line steps check $LASTEXITCODE themselves.
    # No dependency caches: a cache saved on a tag ref is never reused, and a release is built from scratch.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Check the tag against every version
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          uv run python tools/bump_version.py --check $version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force release | Out-Null
          uv run python tools/bump_version.py --notes $version --output release/release-notes.md
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # No cache (see above); setup-node v5+ caches by itself when a package.json names npm.
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable

      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: just

      - name: Install dependencies
        run: |
          uv sync --all-groups
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm --dir frontend install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # code-version.txt and the bundle hash, the PyInstaller onedir sidecar (dist/sidecar), its smoke test
      # (tools/smoke_sidecar.py: the exe started in a throwaway folder; no real AI is called), the tested folder placed
      # at frontend/src-tauri/sidecar for bundle.resources (tools/place_sidecar.py, then sidecar-sources.txt),
      # `just check-sidecar`, `pnpm tauri build`.
      - name: Build
        run: just build

      - name: Collect installers
        run: |
          $bundle = "frontend/src-tauri/target/release/bundle"
          $files = @(Get-ChildItem "$bundle/nsis/*-setup.exe", "$bundle/msi/*.msi" | ForEach-Object FullName)
          if ($files.Count -lt 2) { throw "インストーラーが見つかりません: $($files -join ', ')" }
          Copy-Item $files release/

      # The installers and release-notes.md: all the release job needs.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: release/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release

      - name: Attach to a draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/*.exe release/*.msi)
          if [ "${#files[@]}" -lt 2 ]; then echo "インストーラーが見つかりません" >&2; exit 1; fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A re-run replaces the installers of the existing release and leaves its notes alone.
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --draft --verify-tag \
              --title "Papeer ${TAG#v}" --notes-file release/release-notes.md
          fi
