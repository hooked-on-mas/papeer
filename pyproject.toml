[project]
name = "papeer"
version = "0.2.0"
description = "Papeer: Research Paper Translation and Reading Workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.26.0",
    "pypdfium2>=5.13.0",
    "fonttools>=4.64.0",
    "pillow>=12.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx2>=2.13.1",
    "ruff>=0.6.0",
    "pyright>=1.1.380",
]
build = [
    "pyinstaller>=6.16,<7",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402", "E741", "E722", "E701", "E702", "E711", "E712", "E731", "F403", "F405", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
